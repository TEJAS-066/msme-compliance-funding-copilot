name: monitor-sources
on:
  schedule: [{ cron: "30 3 * * *" }]     # daily 03:30 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/monitor_sources.py
      - name: Commit hashes / queue if changed
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/source_hashes.json data/review_queue.json
          git diff --cached --quiet || (git commit -m "monitor: update source hashes / review queue" && git push)
