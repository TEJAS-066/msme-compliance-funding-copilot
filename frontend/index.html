<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏛️ MSME Compliance & Funding Copilot (React Enterprise)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Bangers&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            comic: ['Bangers', 'cursive', 'sans-serif'],
          },
          colors: {
            gov: {
              emerald: '#0B6E4F',
              emeraldDark: '#085039',
              gold: '#D97706',
              navy: '#0F172A',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Comic Speech Bubble Styles */
    .comic-bubble {
      position: absolute;
      z-index: 99999;
      background: #FFFFFF;
      color: #0F172A;
      border: 3px solid #0F172A;
      border-radius: 18px;
      padding: 16px 20px;
      box-shadow: 6px 6px 0px rgba(15, 23, 42, 0.9);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 340px;
      width: 90vw;
    }
    .dark .comic-bubble {
      background: #1E293B;
      color: #F8FAFC;
      border: 3px solid #10B981;
      box-shadow: 6px 6px 0px rgba(16, 185, 129, 0.6);
    }

    /* Speech Bubble Pointer Arrow (Beak) */
    .comic-bubble::after {
      content: '';
      position: absolute;
      width: 0;
      height: 0;
      border-style: solid;
    }

    /* Arrow pointing DOWN toward component */
    .comic-bubble.arrow-down::after {
      bottom: -14px;
      left: 36px;
      border-width: 14px 12px 0 12px;
      border-color: #0F172A transparent transparent transparent;
    }
    .dark .comic-bubble.arrow-down::after {
      border-color: #10B981 transparent transparent transparent;
    }

    /* Arrow pointing UP toward component */
    .comic-bubble.arrow-up::after {
      top: -14px;
      left: 36px;
      border-width: 0 12px 14px 12px;
      border-color: transparent transparent #0F172A transparent;
    }
    .dark .comic-bubble.arrow-up::after {
      border-color: transparent transparent #10B981 transparent;
    }

    /* Component Pulsing Radar Beacon */
    .tour-ping {
      position: absolute;
      z-index: 99998;
      pointer-events: none;
      border: 3px solid #10B981;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.8), inset 0 0 10px rgba(16, 185, 129, 0.4);
      animation: tourPulse 1.8s infinite ease-in-out;
      transition: all 0.35s ease;
    }
    @keyframes tourPulse {
      0% { transform: scale(0.99); opacity: 0.85; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(0.99); opacity: 0.85; }
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
  <div id="root"></div>

  <!-- Main React App Script -->
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
